<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | KisanDirect</title>
  <link rel="icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#059669">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(5, 150, 105, 0.25);
    }
    .icon-wrap {
      width: 88px;
      height: 88px;
      background: rgba(5, 150, 105, 0.15);
      border: 2px solid rgba(52, 211, 153, 0.3);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #059669;
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
    }
    .btn:hover {
      background: #10b981;
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/icons/icon-192.png" alt="KisanDirect Icon" class="icon-img">
    </div>
    <span class="badge">No Internet Connection</span>
    <h1>You are Currently Offline</h1>
    <p>
      KisanDirect requires an active internet connection to stream live APMC mandi prices and process digital escrow payments.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
